<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-lampka</title>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-link {
            align-self: flex-start;
            margin-bottom: 24px;
            text-decoration: none;
            color: #0077cc;
            font-size: 18px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .image-container img {
            width: 100%;
            max-width: 800px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            background: white;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="media/auto lampka poprawiona.png" alt="">
    </div>

</body>
</html>
